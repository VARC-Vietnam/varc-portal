apiVersion: v1
kind: ConfigMap
metadata:
  name: varc-portal-config
  namespace: varc
data:
  PORT: "3099"
  NEXTAUTH_URL: "https://www.hamvn.com"
  NEXT_PUBLIC_SITE_URL: "https://www.hamvn.com"
  AUTH_URL: "https://www.hamvn.com"
  AUTH_TRUST_HOST: "true"
  STORAGE_DRIVER: "s3"
  S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "varc-media"
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: "https://media.hamvn.com"
