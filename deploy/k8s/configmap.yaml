apiVersion: v1
kind: ConfigMap
metadata:
  name: varc-portal-config
  namespace: varc
data:
  PORT: "3099"
  NEXTAUTH_URL: "https://www.hamvn.com"
  NEXT_PUBLIC_SITE_URL: "https://www.hamvn.com"
  AUTH_URL: "https://www.hamvn.com"
  AUTH_TRUST_HOST: "true"
  STORAGE_DRIVER: "s3"
  S3_ENDPOINT: "https://s3.classq.io"
  S3_REGION: "us-east-1"
  S3_BUCKET: "varc-portal-media"
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: "https://s3.classq.io/varc-portal-media"
  # Media library limits (50MB). Override MIME list only if you need a tighter allow-list.
  MEDIA_MAX_BYTES: "52428800"
  MEDIA_ALLOWED_MIME: "image/jpeg,image/png,image/gif,image/webp,image/svg+xml,video/mp4,video/webm,video/quicktime,application/pdf,text/plain,application/zip,application/x-zip-compressed,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation"
