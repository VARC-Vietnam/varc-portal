apiVersion: apps/v1
kind: Deployment
metadata:
  name: varc-portal
  namespace: varc
  labels:
    app: varc-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: varc-portal
  template:
    metadata:
      labels:
        app: varc-portal
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/varc-vietnam/varc-portal:v0.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3099
          envFrom:
            - secretRef:
                name: varc-portal-secrets
            - configMapRef:
                name: varc-portal-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3099
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3099
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
